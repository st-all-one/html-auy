[package]
name = "html"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
html-macros.workspace = true
# Opcionais: só a feature `audit` (N4, D30) puxa parser de terceiro. Sem ela, o crate não tem
# nenhuma dependência normal.
html5ever = { workspace = true, optional = true }
markup5ever_rcdom = { workspace = true, optional = true }

[features]
audit = ["dep:html5ever", "dep:markup5ever_rcdom"]

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
toml.workspace = true
trybuild.workspace = true
serde_json.workspace = true
