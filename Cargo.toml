# Workspace `html-auy`: geração de HTML tipada.
#
# Três crates publicáveis, em ordem de dependência:
#   html-auy-macros-core → html-auy-macros → html-auy
#
# `sniff-css/` e `fuzz/` NÃO são membros (workspace próprio / workspace-excluded).
# O pin do compilador é `rust-toolchain.toml` (1.99); a MSRV é `rust-version` (1.92).
# São dois números diferentes por decisão (docs/design/22 §2, D32).
[workspace]
members = [
    "crates/html-auy",
    "crates/html-auy-macros",
    "crates/html-auy-macros-core",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/st-all-one/html-auy"

[workspace.dependencies]
html-auy-macros = { version = "0.1.1", path = "crates/html-auy-macros" }
html-auy-macros-core = { version = "0.1.1", path = "crates/html-auy-macros-core" }

html5ever = "0.27"
markup5ever_rcdom = "0.3"
insta = "1"
proptest = "1"
toml = "1"
trybuild = "1"
serde_json = "1"
proc-macro2 = "1"
quote = "1"

# ─────────────────────────── lints ───────────────────────────
#
# Níveis (deny/warn) ficam aqui; valores (limiares, allowlists) ficam em `clippy.toml`.
# Cada crate precisa de `[lints] workspace = true`, senão herda o default e o gate vira ficção.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "deny"
unused_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
unused_import_braces = "deny"
variant_size_differences = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Parser e codegen são iteradores e índices por natureza: estes quatro nascem `allow` no
# workspace (documentado em docs/design/22 §4) porque `#[expect]` por arquivo não é viável.
module_name_repetitions = "allow"
similar_names = "allow"
many_single_char_names = "allow"
min_ident_chars = "allow"

# ── restriction: o que não pode existir neste crate ──
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
wildcard_imports = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
exit = "deny"
disallowed_names = "deny"
absolute_paths = "warn"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# Tamanho: enum/erro/array grande é decisão de API, não detalhe invisível.
large_enum_variant = "deny"
result_large_err = "warn"
large_types_passed_by_value = "warn"
large_stack_arrays = "deny"
large_stack_frames = "warn"
large_futures = "warn"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
overflow-checks = true
debug-assertions = true
